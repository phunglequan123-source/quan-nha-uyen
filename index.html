<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quân Nhã Uyển — Thư viện phim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#101116;
--panel:#1a1c24;
--muted:#a9aab5;
--text:#f6f3f0;
--pink:#d9a7b7;
--gold:#d8bd8a
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font:15px/1.5 Arial,sans-serif
}

header{
position:sticky;
top:0;
z-index:5;
background:#111218ed;
border-bottom:1px solid #ffffff12;
backdrop-filter:blur(12px)
}

.nav{
max-width:1150px;
margin:auto;
padding:14px 20px;
display:flex;
align-items:center;
gap:18px
}

.brand{
font-family:Georgia,serif;
font-size:22px;
color:var(--gold);
white-space:nowrap
}

.brand b{color:var(--pink)}

nav{
display:flex;
gap:16px;
flex:1
}

nav a{
color:#ddd;
text-decoration:none;
font-size:14px
}

nav a:hover{color:var(--gold)}

.search{
max-width:220px;
width:100%;
background:#232530;
border:1px solid #393b48;
color:white;
border-radius:20px;
padding:9px 13px
}

.account{
border:1px solid #665b4a;
border-radius:18px;
color:var(--gold);
padding:8px 13px;
white-space:nowrap
}

main{
max-width:1150px;
margin:auto;
padding:24px 20px 60px
}

.hero{
min-height:250px;
border-radius:20px;
padding:35px;
display:flex;
align-items:end;
background:
linear-gradient(90deg,#17151c 0%,#17151cdd 42%,#17151c22 100%),
linear-gradient(135deg,#60414f,#252637 55%,#9a7765);
overflow:hidden
}

.eyebrow{
color:var(--pink);
letter-spacing:2px;
text-transform:uppercase;
font-size:11px
}

.hero h1{
font:36px Georgia,serif;
margin:8px 0
}

.hero p{
color:#ded9dc;
max-width:520px;
margin:0 0 18px
}

.btn{
display:inline-block;
border:0;
border-radius:22px;
padding:10px 18px;
background:var(--pink);
color:#211820;
font-weight:bold;
text-decoration:none;
cursor:pointer
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin:30px 0 14px
}

.section-head h2{
font:24px Georgia,serif;
margin:0
}

.section-head span{
color:var(--muted);
font-size:13px
}

.filters{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:16px
}

.chip{
border:1px solid #3a3b46;
background:#1b1d25;
color:#ddd;
padding:7px 13px;
border-radius:20px;
cursor:pointer
}

.chip.active{
background:#4b3541;
border-color:var(--pink);
color:white
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:16px
}

.card{
background:var(--panel);
border:1px solid #ffffff0d;
border-radius:13px;
overflow:hidden;
cursor:pointer;
transition:.18s
}

.card:hover{
transform:translateY(-3px);
border-color:#b88d9c
}

.poster{
height:205px;
display:flex;
align-items:end;
padding:12px;
background:linear-gradient(145deg,#57414c,#252b3b 60%,#8c6a5d);
background-size:cover;
background-position:center;
position:relative
}

.poster:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(0deg,#0009,transparent 65%)
}

z
